<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIKTOK HYPER MOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --matrix: #0aff0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="%2300f3ff" /></svg>'), auto;
        }

        /* Квантовый фон */
        .quantum-bg {
            position: fixed;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(0, 243, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 70% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 20%);
            animation: quantum 20s linear infinite;
            z-index: -2;
        }

        /* Голографический контейнер */
        .container {
            opacity: 0;
            transform: perspective(1000px) rotateX(25deg) scale(0.9);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 600px;
            width: 90%;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 80px rgba(0, 243, 255, 0.4),
                        inset 0 0 50px rgba(255, 0, 255, 0.3);
            padding: 40px;
            border-radius: 30px;
            margin: 20px auto;
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent, 
                var(--neon-cyan),
                transparent,
                var(--neon-pink)
            );
            animation: hologram 6s linear infinite;
            z-index: -1;
        }

        .container.show {
            opacity: 1;
            transform: perspective(1000px) rotateX(0) scale(1);
        }

        /* Логотип с квантовым свечением */
        .logo {
            font-size: 100px;
            color: transparent;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 50px var(--neon-pink),
                         0 0 100px var(--neon-cyan);
            margin-bottom: 30px;
            animation: logo-pulse 2s infinite alternate;
        }

        /* Кнопка с плазменным эффектом */
        .hyper-button {
            position: relative;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid transparent;
            color: var(--neon-cyan);
            padding: 20px 50px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.4s;
            margin: 30px 0;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
            overflow: hidden;
            z-index: 2;
        }

        .hyper-button::before {
            content: '';
            position: absolute;
            top: -150%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                var(--neon-cyan),
                var(--neon-pink),
                var(--neon-cyan)
            );
            animation: rotate 3s linear infinite;
            z-index: -1;
        }

        .hyper-button:hover {
            text-shadow: 0 0 15px var(--neon-cyan),
                         0 0 30px var(--neon-pink);
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.6),
                       inset 0 0 20px rgba(255, 0, 255, 0.4);
            transform: translateY(-5px) scale(1.1);
        }

        /* Список версий с 3D-эффектом */
        .versions {
            margin-top: 40px;
            border-top: 2px solid rgba(0, 243, 255, 0.4);
            padding-top: 30px;
        }

        .version-item {
            padding: 20px;
            margin: 20px 0;
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid rgba(0, 243, 255, 0.2);
            border-radius: 15px;
            transition: all 0.4s;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
        }

        .version-item:hover {
            background: rgba(0, 243, 255, 0.1);
            transform: translateX(30px) rotateY(15deg);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
        }

        /* Анимации */
        @keyframes quantum {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50%, -50%); }
        }

        @keyframes hologram {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes logo-pulse {
            0% { filter: hue-rotate(0deg) brightness(1); }
            100% { filter: hue-rotate(360deg) brightness(1.5); }
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* Эффект частиц */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 5s infinite linear;
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }
    </style>
</head>
<body>
    <div class="quantum-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo">
            <i class="fab fa-tiktok"></i>
        </div>
        
        <h1 style="color: var(--neon-pink); margin-bottom: 20px;">
            HYPER MOD<br>
            <span style="color: var(--neon-cyan); font-size: 0.8em;">для TikTok</span>
        </h1>

        <p style="color: #fff; margin: 30px 0; line-height: 1.8;">
            <span style="color: var(--neon-cyan);">✓</span> Без ограничений<br>
            <span style="color: var(--neon-pink);">✓</span> 4K/60FPS видео<br>
            <span style="color: var(--neon-cyan);">✓</span> Все эффекты разблокированы<br>
            <span style="color: var(--neon-pink);">✓</span> Анонимный режим
        </p>

        <a href="https://t.me/c/2671032710/4" class="hyper-button" id="downloadButton">
            <i class="fas fa-rocket"></i> Скачать сейчас
        </a>

        <div class="versions">
            <div class="version-item">HYPER-MOD 12.0 (Квант)</div>
            <div class="version-item">HYPER-MOD 11.5 (Нейрон)</div>
            <div class="version-item">HYPER-MOD 10.0 (Плазма)</div>
        </div>
    </div>

    <script>
        // Инициализация частиц
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 100; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = Math.random() * 5 + 2 + 'px';
                particle.style.animationDuration = Math.random() * 3 + 2 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }

        // 3D-эффект при движении мыши
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            container.style.transform = `
                perspective(1000px)
                rotateX(${y}deg)
                rotateY(${x}deg)
                translateZ(50px)
            `;
        });

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            setTimeout(() => {
                document.querySelector('.container').classList.add('show');
            }, 500);
        });

        // Звуковой эффект (нужно разрешение)
        document.getElementById('downloadButton').addEventListener('click', (e) => {
            e.preventDefault();
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-digital-sci-fi-click-276.mp3');
            audio.play();
            setTimeout(() => {
                window.location.href = e.target.href;
            }, 300);
        });
    </script>
</body>
</html>
